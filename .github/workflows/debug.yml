name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in \
            "https://count.getloli.com/get/@msrofficial?theme=rule34" \
            "https://count.getloli.com/get/@rathijitk404?theme=moebooru" \
            "https://count.getloli.com/@rathijitk404?name=rathijitk404&theme=moebooru&padding=7&offset=0&align=top&scale=1&pixelated=1&darkmode=0"; do
            curl -s -A "$UA" -D /tmp/h -o /tmp/o "$u"
            echo "RESULT $u"
            echo "RESULT type=$(grep -i '^content-type' /tmp/h | tr -d '\r') size=$(wc -c </tmp/o) cache=$(grep -i '^cache-control' /tmp/h | tr -d '\r')"
            echo "RESULT start=$(head -c 260 /tmp/o | tr '\n' ' ')"
            echo "RESULT data-uri=$(grep -o 'data:image' /tmp/o | wc -l) http-href=$(grep -o 'href=\"http' /tmp/o | wc -l) style=$(grep -o '<style' /tmp/o | wc -l) pixelated=$(grep -o 'pixelated' /tmp/o | wc -l) xlink=$(grep -o 'xlink:href' /tmp/o | wc -l)"
          done
